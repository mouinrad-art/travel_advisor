<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Travel Advisor</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#17263c;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:950px;margin:auto;padding:24px}header{background:#142b48;color:white;padding:26px;border-radius:18px;margin-bottom:20px}header h1{margin:0 0 6px}header p{margin:0;color:#d4e1ef}.panel{background:white;border:1px solid #e2e7ee;border-radius:16px;padding:20px;margin-bottom:18px}.chat{height:330px;overflow:auto;display:flex;flex-direction:column;gap:12px}.bubble{max-width:86%;padding:12px 16px;border-radius:15px;white-space:pre-wrap;line-height:1.5}.assistant{background:#eef3f8;align-self:flex-start}.user{background:#dbeafe;align-self:flex-end}form{display:flex;gap:10px;margin-top:14px}input{flex:1;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;min-width:0}button{border:0;border-radius:10px;padding:12px 18px;background:#1d4ed8;color:white;cursor:pointer;font:inherit}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e8eef5;color:#213653}.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}.muted{color:#64748b;font-size:.9rem}.day{border-top:1px solid #e2e8f0;padding-top:14px;margin-top:16px}.activity{margin:10px 0;padding-left:12px;border-left:3px solid #c7d2fe}.cost{font-weight:700}.hidden{display:none}ul{padding-left:22px}#error{color:#b91c1c;margin-top:8px}
</style><link rel="icon" type="image/svg+xml" href="/favicon.svg"></head><body><main class="shell"><header><h1>✈️ AI Travel Advisor</h1><p>Tell me where you'd like to go. I'll build a personalized day-by-day itinerary.</p></header><section class="panel"><div class="toolbar"><strong>Your conversation</strong><button class="secondary" id="reset">New trip</button></div><div class="chat" id="chat" aria-live="polite"><div class="bubble assistant">Hello! Where would you like to travel, and for how many days?</div></div><form id="form"><input id="message" maxlength="2500" placeholder="e.g. 4 days in Lisbon, food and museums" required aria-label="Your message"><button id="send" type="submit">Send</button></form><div id="error" role="alert"></div><p class="muted" id="usage"></p></section><section id="plan" class="panel hidden" aria-live="polite"></section></main><script>
let session={history:[],summary:'',preferences:{},metrics:{input_tokens:0,output_tokens:0,calls:0,latency_seconds:0}};let itinerary=null;
const chat=document.getElementById('chat'),plan=document.getElementById('plan'),err=document.getElementById('error'),send=document.getElementById('send');
function node(tag,text,parent,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;parent.appendChild(e);return e}
function bubble(text,role){node('div',text,chat,'bubble '+role);chat.scrollTop=chat.scrollHeight}
function renderPlan(p){plan.replaceChildren();plan.classList.remove('hidden');node('h2',p.title,plan);node('p',p.summary,plan);node('p','Destination: '+p.destination,plan,'muted');for(const d of p.days){const sec=node('section',undefined,plan,'day');node('h3','Day '+d.day+': '+d.theme,sec);for(const a of d.activities){const item=node('div',undefined,sec,'activity');node('strong',a.time+' — '+a.title,item);node('p',a.description+' · approx. '+a.estimated_cost+' '+p.currency,item)}}node('h3','Estimated budget (whole group)',plan);const b=p.budget;for(const k of ['accommodation','food','transportation','activities','miscellaneous'])node('p',k+': '+b[k]+' '+p.currency,plan);node('p','Total: '+b.total+' '+p.currency,plan,'cost');node('h3','Practical tips',plan);const ul=node('ul',undefined,plan);for(const t of p.tips)node('li',t,ul);node('h3','Assumptions',plan);const al=node('ul',undefined,plan);for(const a of p.assumptions)node('li',a,al);const dl=node('button','Download itinerary JSON',plan);dl.onclick=()=>{const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='travel-itinerary.json';a.click();URL.revokeObjectURL(url)};const md=node('button','Download Markdown',plan);md.className='secondary';md.style.marginLeft='8px';md.onclick=()=>{let lines=['# '+p.title,'',p.summary,''];for(const d of p.days){lines.push('## Day '+d.day+': '+d.theme);for(const a of d.activities)lines.push('- **'+a.time+' — '+a.title+'**: '+a.description+' ('+a.estimated_cost+' '+p.currency+')');lines.push('')}lines.push('## Estimated budget','Total: '+p.budget.total+' '+p.currency,'','## Tips',...p.tips.map(x=>'- '+x),'','## Assumptions',...p.assumptions.map(x=>'- '+x));const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/markdown'}));const a=document.createElement('a');a.href=url;a.download='travel-itinerary.md';a.click();URL.revokeObjectURL(url)};plan.scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const input=document.getElementById('message'),msg=input.value.trim();if(!msg)return;err.textContent='';bubble(msg,'user');input.value='';send.disabled=true;send.textContent='Planning…';try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,session})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Request failed');session=data.session;bubble(data.reply,'assistant');const m=session.metrics;document.getElementById('usage').textContent='API usage: '+m.input_tokens+' input tokens · '+m.output_tokens+' output tokens · '+m.calls+' calls';if(data.itinerary){itinerary=data.itinerary;renderPlan(itinerary)}}catch(ex){err.textContent=ex.message;input.value=msg;bubble('Request failed. Your message is restored in the input so you can retry.','assistant')}finally{send.disabled=false;send.textContent='Send';input.focus()}});
document.getElementById('reset').onclick=()=>{session={history:[],summary:'',preferences:{},metrics:{input_tokens:0,output_tokens:0,calls:0,latency_seconds:0}};itinerary=null;chat.replaceChildren();bubble('Hello! Where would you like to travel, and for how many days?','assistant');plan.replaceChildren();plan.classList.add('hidden');err.textContent='';document.getElementById('usage').textContent=''};
</script></body></html>
